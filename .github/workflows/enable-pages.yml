name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Serve the site from main at /
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: "legacy",
              source: { branch: "main", path: "/" }
            };
            try {
              const created = await github.rest.repos.createPagesSite(params);
              core.info("created " + JSON.stringify(created.data));
            } catch (error) {
              const status = error.status || 0;
              const detail = error.response && error.response.data
                ? JSON.stringify(error.response.data)
                : String(error);
              if (status === 409) {
                const existing = await github.rest.repos.getPages({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                core.info("already enabled " + JSON.stringify(existing.data));
                return;
              }
              core.setFailed(status + " " + detail);
            }
